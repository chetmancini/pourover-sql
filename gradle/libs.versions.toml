[versions]
shadow = "9.6.1"
slf4j = "2.0.20"
commons-cli = "1.11.0"
gson = "2.15.0"
informix = "15.0.1.4"
mssql = "13.6.1.jre11"
redshift = "2.3.0"
mysql = "26.10.0"
postgresql = "42.7.14"
snowflake = "4.4.0"
junit = "6.1.3"
assertj = "3.27.7"
h2 = "2.5.252"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commons-cli" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
informix-jdbc = { module = "com.ibm.informix:jdbc", version.ref = "informix" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
redshift-jdbc = { module = "com.amazon.redshift:redshift-jdbc42", version.ref = "redshift" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
snowflake-jdbc = { module = "net.snowflake:snowflake-jdbc", version.ref = "snowflake" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
