name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux only on purpose (YAGNI): no Windows/macOS matrix until a platform-specific bug shows up.
# Actions are pinned to major tags; Dependabot (github-actions ecosystem) keeps them current.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Also compiles the examples and runs the demo tests. Does not need Docker.
      - name: Build
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (Testcontainers)
    needs: build
    runs-on: ubuntu-latest # Docker is preinstalled on GitHub-hosted runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run e2e tests
        run: ./gradlew e2eTest
      - name: Upload e2e test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: |
            build/reports/tests/e2eTest/
            build/test-results/e2eTest/
          if-no-files-found: ignore
