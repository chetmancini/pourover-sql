#
# Pushing a tag `vX.Y.Z` builds the library jars and the command-line jars, checks the tag
# against gradle.properties, and creates a GitHub Release with the files and checksums.
# A manual run (workflow_dispatch) builds everything and uploads it as workflow artifacts
# only; it never creates a release.
#
# Nothing is sent to Maven Central. That step stays commented out at the bottom until the
# Central Portal namespace for io.github.chetmancini is verified.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: Library jars and staging repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      # Tag pushes must match the project version; manual runs skip this check
      # because the project version is a SNAPSHOT.
      - name: Verify tag matches project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match gradle.properties version $version" >&2
            exit 1
          fi

      # `build` runs the unit tests and assembles the library, sources and javadoc jars.
      - name: Build
        run: ./gradlew build

      - name: Publish to local staging repository
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Collect library jars
        run: |
          mkdir -p dist
          cp build/libs/pourover-sql-*.jar dist/
          rm -f dist/*-all.jar
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: library-jars
          path: dist/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: staging-repo
          path: build/staging-repo
          if-no-files-found: error

  cli:
    name: CLI jar (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: all, engines: "" }
          - { name: postgres, engines: postgres }
          - { name: mysql, engines: mysql }
          - { name: sqlserver, engines: sqlserver }
          - { name: snowflake, engines: snowflake }
          - { name: redshift, engines: redshift }
          - { name: informix, engines: informix }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      # An empty `engines` bundles every driver (the -all jar).
      - name: Build CLI jar
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          if [ -n "$ENGINES" ]; then
            ./gradlew shadowJar -Pengines="$ENGINES"
          else
            ./gradlew shadowJar
          fi

      # The jar must start and report its version; this catches a broken bundle.
      - name: Smoke test
        run: |
          jar="$(ls build/libs/pourover-sql-*-${{ matrix.name }}.jar)"
          java -jar "$jar" --version

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: build/libs/pourover-sql-*-${{ matrix.name }}.jar
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [library, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum ./*.jar > SHA256SUMS
          cat SHA256SUMS
          # A version with a hyphen (1.0.0-rc.1) is marked as a pre-release.
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" $flags --verify-tag --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md). CLI jars: \`-all\` bundles every JDBC driver; the others bundle one." \
            ./*.jar SHA256SUMS

      # ---------------------------------------------------------------------------------
      # DISABLED: enable after Central Portal namespace verification for io.github.chetmancini
      #
      # Intended configuration (requires adding a Central Portal publishing plugin to the
      # build and a Central Portal repository; neither exists yet):
      #
      # - name: Publish to Maven Central (Central Portal)
      #   env:
      #     ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      #     ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      #     ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      #     ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      #   run: ./gradlew publishAllPublicationsToCentralPortalRepository
      # ---------------------------------------------------------------------------------
